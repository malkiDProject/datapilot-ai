version: '3.9'

services:
  mysql:
    image: mysql:8.0
    container_name: datapilot-ai-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-datapilot}
      MYSQL_USER: ${DB_USER:-datapilot}
      MYSQL_PASSWORD: ${DB_PASSWORD:-datapilot_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
    ports:
      - '3307:3306'
    volumes:
      - datapilot_ai_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  datapilot_ai_mysql:
